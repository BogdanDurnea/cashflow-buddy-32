name: Dependency Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC so newly disclosed advisories are caught even without commits
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (fail on critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm audit fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee install.log || {
            echo "::warning::Frozen lockfile install failed; retrying with a regular install."
            bun install 2>&1 | tee -a install.log
          }

      # bun audit talks to the npm advisory endpoint; it can 404/503 transiently.
      # Retry, then fall back to `npm audit` against a generated lockfile so the
      # gate still has real data instead of silently passing.
      - name: Run audit (bun, with npm fallback)
        id: audit
        run: |
          set +e
          source_used="none"
          for attempt in 1 2 3; do
            echo "=== bun audit attempt $attempt ==="
            bun audit --json > audit-report.json 2> audit-error.log
            code=$?
            cat audit-error.log
            if [ -s audit-report.json ]; then source_used="bun"; break; fi
            sleep $((attempt * 5))
          done

          if [ "$source_used" = "none" ]; then
            echo "::warning::bun audit unavailable (last exit $code); falling back to npm audit."
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund > npm-lock.log 2>&1
            npm audit --json > audit-report.json 2> audit-error.log
            cat audit-error.log
            [ -s audit-report.json ] && source_used="npm"
          fi

          echo "source=$source_used" >> "$GITHUB_OUTPUT"
          echo "Audit source: $source_used"
          exit 0

      - name: Human-readable audit log
        if: always()
        run: |
          echo "::group::bun audit (high and above)"
          bun audit --audit-level=high 2>&1 | tee audit-human.log || true
          echo "::endgroup::"

      - name: Evaluate advisories and fail on critical
        if: always()
        run: |
          node .github/scripts/check-audit.mjs
        env:
          AUDIT_SOURCE: ${{ steps.audit.outputs.source }}

      - name: Print full logs on failure
        if: failure()
        run: |
          echo "::group::install.log"; cat install.log 2>/dev/null || echo "(none)"; echo "::endgroup::"
          echo "::group::audit-error.log"; cat audit-error.log 2>/dev/null || echo "(none)"; echo "::endgroup::"
          echo "::group::audit-human.log"; cat audit-human.log 2>/dev/null || echo "(none)"; echo "::endgroup::"
          echo "::group::audit-report.json"; head -c 200000 audit-report.json 2>/dev/null || echo "(none)"; echo "::endgroup::"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_number }}
          path: |
            audit-report.json
            audit-error.log
            audit-human.log
            install.log
            npm-lock.log
          if-no-files-found: ignore
          retention-days: 30