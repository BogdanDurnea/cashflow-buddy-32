name: Dependency Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC so newly disclosed advisories are caught even without commits
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (fail on critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm audit fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee install.log || {
            echo "::warning::Frozen lockfile install failed; retrying with a regular install."
            bun install 2>&1 | tee -a install.log
          }

      # Bun's configured package mirror does not expose npm's audit endpoint.
      # Generate an npm lock from package.json and query the public advisory API.
      - name: Generate audit lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --registry=https://registry.npmjs.org 2>&1 | tee npm-lock.log

      - name: Run dependency audit
        id: audit
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "=== npm audit attempt $attempt ==="
            npm audit --json --registry=https://registry.npmjs.org \
              > audit-report.json 2> audit-error.log
            code=$?
            cat audit-error.log
            if node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("audit-report.json", "utf8"));
              process.exit(data.vulnerabilities && data.metadata ? 0 : 1);
            ' 2>/dev/null; then
              break
            fi
            echo "::warning::Attempt $attempt did not return a valid advisory report."
            sleep $((attempt * 5))
          done

          echo "source=npm" >> "$GITHUB_OUTPUT"
          echo "audit_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Human-readable audit log
        if: always()
        run: |
          echo "::group::npm audit (high and critical)"
          npm audit --audit-level=high --registry=https://registry.npmjs.org \
            2>&1 | tee audit-human.log || true
          echo "::endgroup::"

      - name: Evaluate advisories and fail on critical
        if: always()
        run: |
          node .github/scripts/check-audit.mjs
        env:
          AUDIT_SOURCE: ${{ steps.audit.outputs.source }}

      - name: Print full logs on failure
        if: failure()
        run: |
          echo "::group::install.log"; cat install.log 2>/dev/null || echo "(none)"; echo "::endgroup::"
          echo "::group::audit-error.log"; cat audit-error.log 2>/dev/null || echo "(none)"; echo "::endgroup::"
          echo "::group::audit-human.log"; cat audit-human.log 2>/dev/null || echo "(none)"; echo "::endgroup::"
          echo "::group::audit-report.json"; head -c 200000 audit-report.json 2>/dev/null || echo "(none)"; echo "::endgroup::"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_number }}
          path: |
            audit-report.json
            audit-error.log
            audit-human.log
            install.log
            npm-lock.log
          if-no-files-found: ignore
          retention-days: 30