name: SEO Structured Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seo-jsonld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jsonld:
    name: Validate JSON-LD (FAQPage, BreadcrumbList)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Validate structured data
        run: bun run test:seo

      - name: Build (catches broken SEO imports before deploy)
        run: bun run build
