name: SBOM Generation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM (CycloneDX) + license report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for license-checker CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # cyclonedx-npm executes `npm ls`, which rejects dependency trees
      # installed from bun.lock. Syft catalogs the installed Bun tree directly.
      - name: Generate CycloneDX SBOM (JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          output-file: sbom.cdx.json

      - name: Generate CycloneDX SBOM (XML)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-xml
          artifact-name: sbom.cdx.xml
          output-file: sbom.cdx.xml

      - name: Generate SPDX SBOM via Anchore
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: License report (summary + full CSV)
        run: |
          npx --yes license-checker-rseidelsohn@latest \
            --production \
            --summary > licenses-summary.txt || true
          npx --yes license-checker-rseidelsohn@latest \
            --production \
            --csv \
            --out licenses.csv || true

      - name: Fail on disallowed licenses (GPL/AGPL family)
        id: license_gate
        continue-on-error: true
        run: |
          npx --yes license-checker-rseidelsohn@latest \
            --production \
            --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0;SSPL-1.0"

      - name: Vulnerability scan of SBOM (Grype)
        uses: anchore/scan-action@v6
        id: grype
        continue-on-error: true
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: sarif

      - name: Upload Grype SARIF to code scanning
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

      - name: Build PR summary
        id: summary
        if: always()
        run: |
          set +e
          COMPONENTS=$(node -e "try{const s=require('./sbom.cdx.json');console.log((s.components||[]).length)}catch(e){console.log('n/a')}")
          SBOM_JSON_SIZE=$(du -h sbom.cdx.json 2>/dev/null | cut -f1 || echo 'n/a')
          SBOM_XML_SIZE=$(du -h sbom.cdx.xml 2>/dev/null | cut -f1 || echo 'n/a')
          SPDX_SIZE=$(du -h sbom.spdx.json 2>/dev/null | cut -f1 || echo 'n/a')

          CVE_STATUS="${{ steps.grype.outcome }}"
          LIC_STATUS="${{ steps.license_gate.outcome }}"
          [ "$CVE_STATUS" = "success" ] && CVE_ICON="✅ pass" || CVE_ICON="❌ fail (critical CVEs found)"
          [ "$LIC_STATUS" = "success" ] && LIC_ICON="✅ pass" || LIC_ICON="❌ fail (disallowed license found)"

          LIC_SUMMARY=$(head -n 40 licenses-summary.txt 2>/dev/null || echo "(unavailable)")

          {
            echo "### 📦 SBOM Report — \`${GITHUB_SHA::7}\`"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Components | \`$COMPONENTS\` |"
            echo "| CycloneDX JSON | \`sbom.cdx.json\` ($SBOM_JSON_SIZE) |"
            echo "| CycloneDX XML | \`sbom.cdx.xml\` ($SBOM_XML_SIZE) |"
            echo "| SPDX JSON | \`sbom.spdx.json\` ($SPDX_SIZE) |"
            echo "| License gate | $LIC_ICON |"
            echo "| Grype CVE scan (critical) | $CVE_ICON |"
            echo ""
            echo "<details><summary>License summary (top 40 lines)</summary>"
            echo ""
            echo '```'
            echo "$LIC_SUMMARY"
            echo '```'
            echo "</details>"
            echo ""
            echo "Full SBOMs, CSV, and SARIF are attached to the workflow run as the \`sbom-and-licenses\` artifact."
          } > pr-comment.md

          {
            echo "## SBOM Report"
            cat pr-comment.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post/update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sbom-report
          path: pr-comment.md

      - name: Enforce gates
        if: always()
        run: |
          fail=0
          [ "${{ steps.grype.outcome }}" != "success" ] && { echo "::error::Grype found critical vulnerabilities"; fail=1; }
          [ "${{ steps.license_gate.outcome }}" != "success" ] && { echo "::error::Disallowed license detected"; fail=1; }
          exit $fail

      - name: Upload SBOM + license artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: |
            sbom.cdx.json
            sbom.cdx.xml
            sbom.spdx.json
            licenses-summary.txt
            licenses.csv
          retention-days: 90